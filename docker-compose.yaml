services:
  oss-auto-cert:
    image: ghcr.io/nekoimi/oss-auto-cert:latest
    container_name: oss-auto-cert
    hostname: oss-auto-cert
    command:
      - run
      - --config=/etc/oss-auto-cert/config.toml
    volumes:
      - ./config.toml:/etc/oss-auto-cert/config.toml:ro
      - ./certs:/var/lib/oss-auto-cert
    restart: unless-stopped
    environment:
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请设置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请设置 OSS_ACCESS_KEY_SECRET}
    stop_grace_period: 45s
