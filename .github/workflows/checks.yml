name: Checks
on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_call:
    inputs:
      ref:
        description: "待检查的提交，默认使用触发工作流的提交"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go build -o oss-auto-cert-test ./cmd/oss-auto-cert
  vulnerabilities:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      # v1.9.0 要求 Go 1.26，与测试及发布构建使用相同工具链。
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
