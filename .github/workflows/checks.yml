name: Checks
on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          check-latest: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go build -o oss-auto-cert-test ./cmd/oss-auto-cert
      - run: go build -o oss-auto-cert-legacy main.go
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
