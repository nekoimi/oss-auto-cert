name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有版本标签，例如 v1.2.3"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            echo "::error::发布必须指定已有版本标签。"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本标签格式无效，应使用 v1.2.3 或 v1.2.3-rc.1 等格式。"
            exit 1
          fi
          if ! sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}"); then
            echo "::error::版本标签不存在或未指向提交，请先推送标签。"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  build_binaries:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      CGO_ENABLED: 0
      OUTPUT_NAME: oss-auto-cert
      VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build Binaries
        id: build
        shell: bash
        run: |
          mkdir binaries
          
          linux_arch=('amd64' 'arm64')
          for arch in "${linux_arch[@]}"; do
            export GOARCH="$arch" 
            GOOS=linux go build -o binaries/${{ env.OUTPUT_NAME }}-${VERSION}-linux-${arch} -ldflags="-s -w -X main.Version=${VERSION}" -trimpath ./cmd/oss-auto-cert
          done
          
          windows_arch=('amd64' 'arm64')
          for arch in "${windows_arch[@]}"; do
            export GOOS="windows"
            export GOARCH="$arch"
            go build -o binaries/${{ env.OUTPUT_NAME }}-${VERSION}-windows-${arch}.exe -ldflags="-s -w -X main.Version=${VERSION}" -trimpath ./cmd/oss-auto-cert
          done
          
          darwin_arch=('amd64' 'arm64')
          for arch in "${darwin_arch[@]}"; do
            export GOOS="darwin"
            export GOARCH=$arch
            go build -o binaries/${{ env.OUTPUT_NAME }}-${VERSION}-darwin-${arch} -ldflags="-s -w -X main.Version=${VERSION}" -trimpath ./cmd/oss-auto-cert
          done
          
          ls -l binaries

      - name: Move Files to Release Directory
        shell: bash
        run: |
          mkdir -p release

          for file in $(ls binaries | grep -E "^${{ env.OUTPUT_NAME }}"); do
            mv binaries/$file release/
          done

          for file in $(ls release); do
            sha256sum release/$file | awk '{print $1}' > release/$file.sha256.txt
          done

          ls -l release/

      - name: Build Changelog
        id: github_pr_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Changelog Use Commit
        uses: Bullrich/generate-release-changelog@master
        id: github_commit_changelog
        env:
          REPO: ${{ github.repository }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ needs.prepare.outputs.sha }}
          name: "Release ${{ env.VERSION }}"
          prerelease: false
          body: |
            ${{ steps.github_pr_changelog.outputs.changelog }}
            ${{ steps.github_commit_changelog.outputs.changelog }}
          artifacts: release/*
