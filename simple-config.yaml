# 旧版 YAML 兼容示例。新安装推荐 config init 生成 TOML。
# 保留旧行为：每个 Bucket 只处理返回的第一个已绑定域名，最低提前 15 天续期。
# 阿里云凭证通过 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 提供。

acme:
  email: admin@example.com
  data-dir: /var/lib/oss-auto-cert
  expired-early: 30

buckets:
  - name: my-bucket
    endpoint: oss-cn-hangzhou.aliyuncs.com

# 可选企业微信机器人通知；取消注释后替换为自己的地址。
# webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=replace-me
# 不设置 webhook-tpl 时使用内置 JSON 模板，安全处理换行和引号。
# 已有自定义 webhook-tpl 会保留旧模板语义；请执行 config validate 检查。
